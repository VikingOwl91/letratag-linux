name: rust-and-mock-ipp
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - name: Install development dependencies inside the CI container
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates git curl pkg-config \
            libcups2-dev cups-client cups-ipp-utils poppler-utils qpdf util-linux iproute2 \
            libavahi-client-dev libssl-dev libpng-dev libjpeg-dev zlib1g-dev libdbus-1-dev jq
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: clippy,rustfmt
      - name: Build pinned PAPPL into the project
        run: bash scripts/build-pappl.sh
      - name: Rust checks
        run: |
          export PKG_CONFIG_PATH="$PWD/.research/pappl-prefix/lib/pkgconfig"
          cargo fmt --all -- --check
          cargo test --locked --workspace
          cargo test --locked --workspace --all-features
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo build --locked --release --workspace --all-features
      - name: Loopback IPP integration, never physical BLE
        run: bash scripts/test-ipp.sh
      - name: Dependency license inventory
        run: bash scripts/check-licenses.sh | tee test-output/dependency-licenses.tsv
