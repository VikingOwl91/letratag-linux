name: rust-and-mock-ipp
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    container: ubuntu:24.04
    steps:
      - name: Install development dependencies inside the CI container
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential ca-certificates git curl pkg-config \
            libcups2-dev cups-client cups-bsd cups-ipp-utils poppler-utils qpdf util-linux iproute2 \
            libavahi-client-dev libssl-dev libpng-dev libjpeg-dev zlib1g-dev libdbus-1-dev jq \
            python3
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.98.1
          components: clippy,rustfmt
      - name: Check CI prerequisites
        run: |
          for tool in bash git make cc cargo rustfmt python3 ipptool lp lpr ss qpdf jq prlimit pdftoppm; do
            command -v "$tool" >/dev/null 2>&1 || { echo "missing CI prerequisite: $tool" >&2; exit 1; }
          done
      - name: Build pinned PAPPL into the project
        run: bash scripts/build-pappl.sh
      - name: Rust checks
        run: |
          export PKG_CONFIG_PATH="$PWD/.research/pappl-prefix/lib/pkgconfig"
          cargo fmt --all -- --check
          rustfmt --check tests/make-pdf.rs tests/ipp-client.rs tests/inspect-captures.rs tests/inspect-direct-captures.rs
          cargo test --locked --workspace
          cargo test --locked --workspace --all-features
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo build --locked --release --workspace --all-features
      - name: Mock-only build without a Bluetooth backend
        run: |
          export PKG_CONFIG_PATH="$PWD/.research/pappl-prefix/lib/pkgconfig"
          cargo build --locked --release -p letratag-printer --features pappl
          # The mock-only build must not pull in bluer or btleplug: a
          # mock-only user should not need the Bluetooth stack at all.
          if cargo tree --locked -p letratag-printer --features pappl -e normal \
            | grep -qE '(^| )(bluer|btleplug) v'; then
            echo "the mock-only build must not depend on a BLE backend" >&2
            exit 1
          fi
      - name: Minimum supported Rust version
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          export PKG_CONFIG_PATH="$PWD/.research/pappl-prefix/lib/pkgconfig"
          cargo +1.98.0 check --locked --workspace --all-features
      - name: Recommended Direct IPP clients and media, mock only
        run: bash scripts/test-direct-ipp.sh
      - name: PDF-only loopback receive policy, never physical BLE
        run: bash scripts/test-ipp.sh
      - name: Protocol forensic decoder
        run: python3 scripts/test-forensic-raster.py
      - name: Documentation links
        run: python3 scripts/check-docs.py
      - name: Dependency license inventory
        run: bash scripts/check-licenses.sh | tee test-output/dependency-licenses.tsv
