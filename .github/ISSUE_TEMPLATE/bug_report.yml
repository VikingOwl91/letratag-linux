name: Bug report
description: Something does not work as documented, including in mock-only use.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem.

        **Please remove private information from anything you paste:** Bluetooth
        device addresses, hostnames, usernames, home directory paths, and the
        contents of journal or capture files. Geometry measurements and the
        printer model are what the project needs.

        Most problems can be reproduced without a printer. If your report is
        about mock-only behaviour, say so below.

  - type: input
    id: version
    attributes:
      label: Software version or commit
      description: The release you used, or the commit SHA you built from.
      placeholder: "v0.3.0, or 94f2e34"
    validations:
      required: true

  - type: input
    id: distribution
    attributes:
      label: Linux distribution and version
      description: For example "Arch Linux, kernel 6.9" or "Ubuntu 24.04".
      placeholder: "Ubuntu 24.04"
    validations:
      required: true

  - type: input
    id: kernel
    attributes:
      label: Kernel version
      description: "The output of `uname -r`."
      placeholder: "6.9.4-arch1-1"
    validations:
      required: true

  - type: dropdown
    id: transport
    attributes:
      label: Transport backend
      description: Which transport was in use?
      options:
        - mock
        - BlueZ
        - btleplug
        - Not applicable
    validations:
      required: true

  - type: dropdown
    id: installation
    attributes:
      label: Installation method
      options:
        - Built from source
        - Arch package built from packaging/arch/PKGBUILD
        - Other
    validations:
      required: true

  - type: input
    id: printer-model
    attributes:
      label: Printer model
      description: Only if hardware was involved. Which DYMO model?
      placeholder: "LetraTag 200B"
    validations:
      required: false

  - type: input
    id: bluetooth-adapter
    attributes:
      label: Bluetooth adapter
      description: Only if hardware was involved. Chipset and kernel driver, if known.
      placeholder: "Intel AX210, btusb"
    validations:
      required: false

  - type: checkboxes
    id: hardware-context
    attributes:
      label: Hardware context
      options:
        - label: "Real hardware was involved (the job reached a physical printer)."
        - label: "A physical label was actually observed on the printer."
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: The exact commands, in order, starting from a clean state.
      placeholder: |
        1. Start the server with: ...
        2. Submit with: ...
        3. Observe: ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen, and where is that documented?
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: The error message, the wrong output, or the unexpected behaviour.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Sanitized logs
      description: Relevant output, with addresses, usernames and paths removed.
      placeholder: "paste the relevant output here"
    validations:
      required: false
