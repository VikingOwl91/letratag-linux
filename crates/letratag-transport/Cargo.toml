[package]
name = "letratag-transport"
# Versioned separately from the workspace: the published 0.1.1 predates the
# btleplug backend, so this crate needs its own next version. The other
# crates stay at the workspace version, which matches what is published.
version = "0.1.2"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Bounded mock, BlueZ and btleplug transports for LetraTag printers, with adaptive GATT chunk sizing"
repository = "https://github.com/VikingOwl91/letratag-linux"
readme = "README.md"
keywords = ["bluetooth", "label", "printer", "letratag", "ble"]
categories = ["hardware-support", "network-programming"]

[features]
default = []
ble = ["dep:bluer", "dep:futures-util"]
btleplug = ["dep:btleplug", "dep:futures-util", "dep:uuid"]

[dependencies]
async-trait.workspace = true
thiserror.workspace = true
tokio.workspace = true
bluer = { version = "=0.17.4", optional = true, features = ["bluetoothd"] }
futures-util = { version = "0.3", optional = true }
btleplug = { workspace = true, optional = true }
uuid = { version = "1", optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["test-util"] }
letratag-protocol.workspace = true
letratag-render.workspace = true
