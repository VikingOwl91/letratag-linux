[package]
name = "letratag-printer"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "PAPPL/IPP print service and CLI for the DYMO LetraTag 200B (internal application crate)"
repository = "https://github.com/VikingOwl91/letratag-linux"
build = "build.rs"

[features]
default = []
pappl = []
ble = ["letratag-transport/ble", "dep:bluer", "dep:futures-util"]

[dependencies]
letratag-protocol.workspace = true
letratag-render.workspace = true
letratag-transport.workspace = true
tokio.workspace = true
thiserror.workspace = true
clap = { version = "4", features = ["derive"] }
tempfile = "3"
wait-timeout = "0.2"
libc = "0.2"
image = { version = "0.25", default-features = false, features = ["png"] }
bluer = { version = "=0.17.4", optional = true, features = ["bluetoothd"] }
futures-util = { version = "0.3", optional = true }

[build-dependencies]
cc = "1"
pkg-config = "0.3"

[dev-dependencies]
async-trait.workspace = true
tokio = { workspace = true, features = ["test-util"] }
