[workspace]
members = ["crates/letratag-protocol", "crates/letratag-render", "crates/letratag-transport", "crates/letratag-printer"]
resolver = "2"

[workspace.package]
version = "0.1.1"
edition = "2024"
license = "MIT"
rust-version = "1.98"

[workspace.dependencies]
letratag-protocol = { path = "crates/letratag-protocol", version = "0.1.1" }
letratag-render = { path = "crates/letratag-render", version = "0.1.1" }
letratag-transport = { path = "crates/letratag-transport", version = "0.1.1" }
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "time", "sync", "macros", "io-util"] }
async-trait = "0.1"
proptest = "1"
# Pinned exactly: BLE transport backend migration comparison requires a
# reproducible dependency (see docs/btleplug-migration-plan.md).
btleplug = { version = "=0.11.8" }

[profile.release]
lto = "thin"
codegen-units = 1
panic = "unwind"
